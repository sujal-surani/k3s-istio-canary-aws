apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: canary-app-vs
  namespace: canary-demo
spec:
  hosts:
    - "*"
  gateways:
    - canary-gateway
  http:
    - route:
        - destination:
            host: canary-app-svc
            subset: v1
          weight: 80
        - destination:
            host: canary-app-svc
            subset: v2
          weight: 20