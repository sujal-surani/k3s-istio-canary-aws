apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-app-v1
  namespace: canary-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-app
      version: v1
  template:
    metadata:
      labels:
        app: canary-app
        version: v1
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:0.2.3
          args:
            - "-listen=:8080"
            - "-text=Response from v1 (STABLE)"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"