apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: canary-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: canary-app-dr
spec:
  host: canary-app-svc
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: canary-app-vs
spec:
  hosts:
    - "*"
  gateways:
    - canary-gateway
  http:
    - route:
        - destination:
            host: canary-app-svc
            subset: v1
          weight: {{ .Values.stable.weight }}
        - destination:
            host: canary-app-svc
            subset: v2
          weight: {{ .Values.canary.weight }}
